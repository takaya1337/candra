name: candra
description: "Candra: a calendar and a practice journal, read by many calendars at once."
publish_to: 'none'
version: 1.4.1+18

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.0
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sacred_time:
    path: ../packages/sacred_time
  shared_preferences: ^2.5.6
  sm_design:
    path: ../packages/sm_design
  sqlite3: ^3.7.0
  timezone: ^0.11.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: false
  # The tables of bazi that schools differ on: data, each with its lineage
  # and whether it has been verified, never code.
  assets:
    - assets/bazi/
    - assets/licences/
    # The manual's exhibits (tool/manual_pictures.sh).
    - assets/manual/
    - assets/manual/en-dark/
    - assets/manual/en-light/
    - assets/manual/id-dark/
    - assets/manual/id-light/
    - assets/places/
    # The privacy policies, as published (lib/menu/policy_screen.dart).
    - assets/privacy/
    # The store screenshots' sample words (lib/journal/showcase_text.dart).
    - assets/samples/
    - assets/stance/
    - assets/stars/
    - assets/iching/

# The app icon, from the Candra logo kit (LOGOMAKER/output/candra/icons).
# After changing the images: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/candra_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1B2E"
  # The images already keep the mark inside Android's safe zone, so the tool
  # must not shrink them again (its default is a further 16% inset).
  adaptive_icon_foreground_inset: 0
  adaptive_icon_foreground: "assets/icon/candra_adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/candra_adaptive_monochrome.png"
